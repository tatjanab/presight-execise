services:
  api:
    build:
      context: .
      target: server
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_PATH: /data/directory.db
    volumes:
      - sqlite-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      target: client
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
